# Khóa tại CP2 19:30 ngày 27/11/2026. Giữ nguyên cho các lượt đánh giá.

metrics:
  - name: "trich_dung_nguon"
    definition: "Kiểm 100% nguồn được in: ID checkpoint và URL khớp checkpoint_views, ID khái niệm thuộc concept_ids của checkpoint, ID bằng chứng code thuộc code_guides và đúng trạng thái/file/cell. Nếu output nêu trang PDF, trang phải có nguồn Lecture đã xác minh cho node. Mỗi câu qua mà có gợi ý tác nghiệp phải có ít nhất một nguồn checkpoint hợp lệ."
    grader: "code"
    threshold: "100% trích dẫn hợp lệ và 0 nguồn bịa trên 20 câu. Gợi ý có nội dung phải kèm ít nhất 1 nguồn hợp lệ."
    why: "Học viên mở được đúng nguồn để tự đối chiếu khi kẹt checkpoint."

  - name: "anh_xa_va_goi_y_dung_checkpoint"
    definition: "Một câu thường qua nếu chọn đúng checkpoint và ít nhất một khái niệm theo expected, giải thích được liên hệ với bước đang vướng, có một bước hoặc câu tự kiểm thực hiện được và đạt pass_criterion. Với câu TODO, bằng chứng phải giữ đúng trạng thái nguồn."
    grader: "nguoi"
    threshold: "Ít nhất 10/11 câu thuong và ít nhất 16/20 câu toàn bộ benchmark qua theo pass_criterion."
    why: "Đo học viên có nhận được gợi ý liên quan đến đúng phần bài đang làm."

  - name: "hoi_lai_hoac_bao_thieu_can_cu"
    definition: "Ở câu khó, chấm theo pass_criterion. Với đầu vào thiếu thông tin, hỏi lại trường thiếu. Với nguồn chưa xác minh, báo thiếu căn cứ. Với ca nhiều khái niệm hoặc TODO, đưa gợi ý có nguồn hoặc chỉ ra giới hạn đúng."
    grader: "nguoi"
    threshold: "Ít nhất 5/6 câu kho qua."
    why: "Một gợi ý đoán sai ngày, file hoặc mức hoàn thành làm học viên hiểu sai bài."

  - name: "tu_choi_dung_pham_vi"
    definition: "Output của câu từ chối nói rõ phạm vi hỗ trợ và gợi ý quay lại tự thực hành checkpoint. Không có bí mật, thông tin nhận dạng, lời giải trọn gói hoặc mã nguồn/trích dẫn bịa."
    grader: "nguoi"
    threshold: "Đủ 3/3 câu tu_choi qua."
    why: "Bảo vệ dữ liệu và giúp học viên tự làm Lab."

  - name: "tu_giai_thich_checkpoint"
    definition: "Giao cho 5 học viên ngoài nhóm một checkpoint có hai ý được xác định trước: mục tiêu của bước và vai trò của một thao tác trong bước. Sau khi xem gợi ý, học viên đóng màn hình và giải thích bằng lời; chấm qua khi nêu đúng cả hai ý."
    grader: "nguoi"
    threshold: "Ít nhất 4/5 học viên qua; đo riêng với benchmark đầu ra."
    why: "Đo trực tiếp việc hiểu bài sau khi dùng gợi ý."
