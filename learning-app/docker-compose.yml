services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LEARNING_DB_PATH: /data/learning.sqlite3
      GRAPH_DB_PATH: /data/graphrag.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      USE_REMOTE_EMBEDDINGS: ${USE_REMOTE_EMBEDDINGS:-0}
    volumes:
      - learning_data:/data
      - ../data/lab-mapping:/app/data/lab-mapping:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: learning-app/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  learning_data:
